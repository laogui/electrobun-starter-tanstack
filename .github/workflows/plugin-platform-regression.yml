name: Plugin platform regression

# Runs the packaged trusted-plugin acceptance probes (T3 exit, T4, T5) on the
# officially supported plugin platforms: macOS arm64 and macOS x64. Each probe
# builds its own canary with the probe renderer enabled, unpacks the launcher
# and drives the real app, so these builds are never published.
#
# macOS x64 runs on `macos-15-intel`, a real Intel machine rather than Rosetta;
# the probes still record `hw.model` / `sysctl.proc_translated` so the evidence
# states which one it was. Windows and Linux are intentionally absent: the
# plugin system is documented as unverified and unsupported there.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Which macOS architectures to run
        type: choice
        default: both
        options:
          - both
          - arm64
          - x64
      examples_base_url:
        description: Public HTTPS base of the published example packages (T5)
        type: string
        default: https://dl.ghostboard.app/plugins/examples
      run_t5:
        description: Run the T5 public-HTTPS probe (requires published examples)
        type: boolean
        default: true

concurrency:
  group: plugin-platform-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          arm64='{"os":"macos-14","arch":"arm64","label":"macOS arm64"}'
          x64='{"os":"macos-15-intel","arch":"x64","label":"macOS x64"}'
          case "$ARCH" in
            arm64) include="[$arm64]" ;;
            x64) include="[$x64]" ;;
            *) include="[$arm64,$x64]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  probes:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Record machine
        shell: bash
        run: |
          {
            echo "uname: $(uname -m)"
            echo "hw.model: $(sysctl -n hw.model)"
            echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
            echo "proc_translated: $(sysctl -n sysctl.proc_translated 2>/dev/null || echo n/a)"
            echo "macOS: $(sw_vers -productVersion)"
          } | tee machine.txt

      - name: T3 exit fixtures
        run: bun run test:plugin-t3-exit-fixtures

      - name: T3 packaged exit probe
        run: bun run test:plugin-t3

      - name: T4 packaged probe
        run: bun run test:plugin-t4

      - name: T5 public HTTPS probe
        if: ${{ inputs.run_t5 }}
        run: bun run test:plugin-t5 --base-url="${{ inputs.examples_base_url }}"

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp machine.txt evidence/
          for stage in t3 t4 t5; do
            if compgen -G "build/plugin-${stage}-artifacts/*.json" > /dev/null; then
              cp build/plugin-${stage}-artifacts/*.json evidence/
            fi
          done
          # Probe stdout/stderr and per-phase app logs live in the temp
          # evidence directories; keep them for failure analysis.
          for dir in "${TMPDIR:-/tmp}"/ghostboard-plugin-t*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            mkdir -p "evidence/$name"
            find "$dir" -maxdepth 1 -type f \( -name '*.log' -o -name '*.json' -o -name '*.jsonl' \) \
              -exec cp {} "evidence/$name/" \;
          done
          ls -R evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-platform-evidence-${{ matrix.arch }}
          path: evidence
          if-no-files-found: warn
          retention-days: 90

name: Publish plugin SDK

# Publishes @ghostboard/sdk and create-ghostboard-plugin to npm with provenance.
# Triggered by pushing an `sdk-v<version>` tag whose version matches
# packages/plugin-sdk/package.json, or manually with --dry-run for rehearsal.
on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run instead of publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify templates and publish
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check tag matches SDK version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          SDK_VERSION="$(bun -e 'console.log(require("./packages/plugin-sdk/package.json").version)')"
          if [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @ghostboard/sdk $SDK_VERSION" >&2
            exit 1
          fi

      - name: Verify compatibility documents
        run: bun scripts/trusted-plugin-t5/verify-compat-docs.ts

      - name: Verify templates against the packed SDK tarball
        run: bun run test:plugin-templates

      - name: Publish @ghostboard/sdk
        working-directory: packages/plugin-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi

      - name: Publish create-ghostboard-plugin
        working-directory: packages/create-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
